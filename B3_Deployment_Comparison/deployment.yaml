apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-portal
spec:
  # TODO 1 completed: three replicas and matching pod selector.
  replicas: 3
  selector:
    matchLabels:
      app: result-portal
  template:
    metadata:
      labels:
        app: result-portal
    spec:
      containers:
        - name: portal
          image: result-portal:assignment5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # TODO 2 completed: resource requests and limits.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: result-portal
spec:
  type: LoadBalancer
  selector:
    app: result-portal
  ports:
    - port: 80
      targetPort: 8000
